name: Release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Wersja aplikacji, np. 0.2.0"
        required: true
      version_code:
        description: "Numer builda Android, musi rosnac"
        required: true
      release_notes:
        description: "Opis wydania"
        required: false
      prerelease:
        description: "Oznacz jako prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Brak sekretu ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build signed release APK
        env:
          APP_VERSION_NAME: ${{ inputs.version_name }}
          APP_VERSION_CODE: ${{ inputs.version_code }}
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/release-keystore.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Prepare release files
        id: files
        shell: bash
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          APK_TARGET="BMW_garage_helper-${VERSION_NAME}.apk"
          cp "$APK_SOURCE" "$APK_TARGET"
          sha256sum "$APK_TARGET" > "${APK_TARGET}.sha256"
          echo "apk_name=$APK_TARGET" >> "$GITHUB_OUTPUT"
          echo "sha_name=${APK_TARGET}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ inputs.version_name }}
          path: |
            ${{ steps.files.outputs.apk_name }}
            ${{ steps.files.outputs.sha_name }}

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="v${{ inputs.version_name }}"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          if [ -n "${{ inputs.release_notes }}" ]; then
            printf "%s\n" "${{ inputs.release_notes }}" > "$NOTES_FILE"
          else
            cat <<EOF > "$NOTES_FILE"
          APK release ${{ inputs.version_name }}

          - versionCode: ${{ inputs.version_code }}
          - asset: ${{ steps.files.outputs.apk_name }}
          EOF
          fi

          PRERELEASE_FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$TAG" \
            "${{ steps.files.outputs.apk_name }}" \
            "${{ steps.files.outputs.sha_name }}" \
            --title "BMW Garage Helper ${{ inputs.version_name }}" \
            --notes-file "$NOTES_FILE" \
            $PRERELEASE_FLAG
